name: New-grad job monitor

on:
  schedule:
    - cron: "7-57/10 5-23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose monitor, source smoke test, or Discord notification test"
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - smoke
          - test-notification

permissions:
  contents: write

concurrency:
  group: new-grad-job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install '.[test]'

      - name: Unit and adapter-contract tests
        run: pytest -q

      - name: Production source smoke tests
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
        run: job-monitor smoke

      - name: Test Discord notification
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-notification'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: job-monitor test-notification

      - name: Restore durable state
        if: github.event_name == 'schedule' || inputs.mode == 'monitor'
        run: bash scripts/load_state.sh .state/jobs.json

      - name: Poll and notify
        id: poll
        if: github.event_name == 'schedule' || inputs.mode == 'monitor'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: job-monitor run --state .state/jobs.json

      - name: Persist durable state
        if: always() && steps.poll.outcome != 'skipped'
        run: bash scripts/save_state.sh .state/jobs.json

      - name: Surface polling failure
        if: steps.poll.outcome == 'failure'
        run: exit 1
