[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "new-grad-job-monitor"
version = "1.0.0"
description = "Production monitor for new-grad and early-career software jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
job-monitor = "job_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_monitor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
